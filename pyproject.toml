[project]
name = "xiaoyuan-memory-graph"
version = "0.1.0"
description = "A local-first, auditable memory graph for Xiaoyuan 14B, built on Relate by Neo4j."
requires-python = ">=3.9"
dependencies = ["relate-db>=1.0.1"]

[project.scripts]
xiaoyuan-memory = "xiaoyuan_memory_graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
